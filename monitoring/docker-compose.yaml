# Local monitoring stack for benchy.
#
# Run a benchmark with the metrics endpoint enabled (the default port is 8080):
#   clj -M -m benchy.bench example --duration PT5M
# then bring up Prometheus + Grafana:
#   docker compose -f monitoring/docker-compose.yaml up
# Grafana is then on http://localhost:3001 (anonymous admin), scraping the
# harness via Prometheus (http://localhost:9090).
services:
  grafana:
    image: 'grafana/grafana-oss:11.4.0'
    container_name: benchy-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
      - ./dashboards.yaml:/etc/grafana/provisioning/dashboards/dashboards.yaml
      - ./dashboards:/var/lib/grafana/dashboards
    networks:
      - monitoring
    depends_on:
      - prometheus
    restart: always

  prometheus:
    image: prom/prometheus:v3.0.0
    container_name: benchy-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    networks:
      - monitoring
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

networks:
  monitoring:
